<div class="top-bar" id="top-bar">
    <div class="top-bar-container">
        <div class="accessibility-controls" role="group" aria-label="Controles de acessibilidade">
            <div class="font-size-controls" role="group" aria-label="Controle de tamanho da fonte">
                <button type="button" class="font-btn font-btn-reduce" id="font-reduce" aria-label="Reduzir fonte" title="Reduzir fonte">
                    <span class="font-btn-icon">A-</span>
                </button>
                <button type="button" class="font-btn font-btn-increase" id="font-increase" aria-label="Aumentar fonte" title="Aumentar fonte">
                    <span class="font-btn-icon">A+</span>
                </button>
            </div>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
                <i class="fas fa-moon" aria-hidden="true"></i>
            </button>
            <div class="top-bar-divider" aria-hidden="true"></div>
        </div>
        <div class="skip-controls" role="group" aria-label="Navegação rápida">
            <a href="#main-header" class="skip-btn" id="skip-top" aria-label="Ir para o topo da página">
                <i class="fas fa-arrow-up" aria-hidden="true"></i>
                <span class="skip-label">Topo</span>
            </a>
            <a href="#main-content" class="skip-btn" id="skip-content" aria-label="Ir para o conteúdo principal">
                <i class="fas fa-arrow-down" aria-hidden="true"></i>
                <span class="skip-label">Conteúdo</span>
            </a>
            <a href="#footer" class="skip-btn" id="skip-footer" aria-label="Ir para o rodapé">
                <i class="fas fa-arrow-down" aria-hidden="true"></i>
                <span class="skip-label">Rodapé</span>
            </a>
        </div>
    </div>
</div>
